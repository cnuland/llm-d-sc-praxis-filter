# PLACEHOLDER ONLY - DO NOT PUT THE REAL KEY IN THIS FILE.
#
# The real Secret is created at deploy time by hack/deploy-cluster.sh, which
# copies the value straight out of secret `laguna-api-key` (key `key`) in
# namespace `homelab-maas`. It copies the already-base64-encoded value, so the
# plaintext token is never decoded, never written to disk, and never placed on a
# command line where `ps` could see it.
#
# This file exists to document the shape the manifests expect. It is NOT applied
# by kustomize and NOT applied by the deploy script.
#
# To create it by hand instead:
#   oc create secret generic ds4-api-key -n praxis-poc --from-literal=key=<TOKEN>
apiVersion: v1
kind: Secret
metadata:
  name: ds4-api-key
  namespace: praxis-poc
type: Opaque
stringData:
  key: "REPLACE_ME_AT_DEPLOY_TIME"
