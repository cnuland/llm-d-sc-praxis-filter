# ==============================================================================
# ALTERNATIVE: per-cluster credential injection - NOT THE DEFAULT
# ==============================================================================
#
# SPEC-K8S 3.1 concludes that injecting the ds4 token only when routing to the
# `large` cluster "is not expressible in today's Praxis contract", and therefore
# prescribes the unconditional `headers` filter used in praxis-config.yaml.
#
# That conclusion is correct about the mechanism it examined - filter CONDITIONS.
# `should_execute` evaluates ConditionMatch against the original downstream
# request only, so no filter can be *conditioned* on a routing decision made
# earlier in the same chain. That part of the finding stands.
#
# But Praxis already ships a filter that solves the actual problem a different
# way. `credential_injection` does not use conditions at all: it reads
# `ctx.cluster` directly inside its own on_request and looks the cluster name up
# in a map (filter/src/builtins/http/security/credential_injection/filter.rs).
# Our llm_d_sc filter sets ctx.cluster exactly as `router` does, which is the
# precondition that filter documents ("matches on the cluster name selected by
# the router filter earlier in the pipeline").
#
# Using it removes BOTH problems the default config accepts:
#
#   1. No credential leak. The token goes only to `large` (ds4). qwen38 never
#      receives it, so a misroute cannot hand the ds4 key to the wrong upstream.
#   2. No config templating. `env_var` is resolved from the process environment
#      at filter construction, so the token is read straight from the Secret and
#      NEVER appears in the ConfigMap or in a rendered file on disk. The
#      initContainer becomes a no-op passthrough. Praxis wraps the value in
#      SecretString/Zeroizing so it is not accidentally logged.
#
# This is shipped as the alternative rather than the default because SPEC-K8S 3.1
# explicitly prescribes the `headers` approach. Switch with:
#
#   hack/deploy-cluster.sh --config credential-injection
#
# NOTE: unverified end-to-end. It is validated by dry-run and by config schema,
# but it has not been exercised against a running proxy, because the filter crate
# does not compile yet and no image has been built.
# ==============================================================================

# Praxis configuration for the llm_d_sc routing POC (SPEC-K8S 3).
#
# This variant contains NO credential placeholder at all: the token is read from
# the DS4_API_KEY environment variable by the credential_injection filter itself.
# render-config.sh therefore copies this file through verbatim.
#
# (The base config's placeholder note is deliberately NOT carried over here.
# render-config.sh substitutes the placeholder token anywhere it appears,
# comments included, so leaving the note in would have written the real
# credential into a comment in the rendered config.)

# The admin listener carries the Kubernetes probes:
#   GET /healthy  liveness  - 200 once the server accepts connections
#   GET /ready    readiness - 503 if any cluster has zero healthy endpoints
#   GET /metrics  prometheus
# It must bind 0.0.0.0, not loopback, because the kubelet probes from outside the
# container's network namespace. Praxis refuses a non-loopback admin bind unless
# allow_public_admin is set, so that flag is required here rather than optional.
# The admin port is deliberately NOT exposed through the Service or the Route.
admin:
  address: "0.0.0.0:9901"
  verbose: true

insecure_options:
  allow_public_admin: true

listeners:
  - name: http
    address: "0.0.0.0:8080"
    filter_chains: [ai-routing]

  # ---------------------------------------------------------------------------
  # BENCHMARK LISTENERS (SPEC-BENCH B-5 / B-7). Added for the in-cluster runs.
  #
  # They exist because SPEC 2.2 makes `router` and `llm_d_sc` mutually exclusive
  # inside one chain (`check_conflicting_cluster_selectors`), so the two static
  # B-5 arms cannot be expressed as a variant of `ai-routing` - they need their
  # own chains, and therefore their own listeners.
  #
  # None of them alter the :8080 production path, which is the one the POC
  # ships. They are additive and inert unless something drives them.
  # ---------------------------------------------------------------------------

  # B-5 arm `always-large`: everything to ds4-flash-0731, no classification.
  - name: bench-always-large
    address: "0.0.0.0:8082"
    filter_chains: [bench-large-chain]

  # B-5 arm `always-small`: everything to qwen38-27b, no classification.
  - name: bench-always-small
    address: "0.0.0.0:8083"
    filter_chains: [bench-small-chain]

  # B-7 measured arm: request_id -> llm_d_sc -> static_response.
  # Terminating in `static_response` rather than a model keeps the whole B-7
  # sweep (concurrency 1/4/16) off the single-replica homelab backends, which
  # SPEC-BENCH 3 requires, while still paying the full classification cost:
  # body buffer + extract + gRPC across the ClusterIP Service + model forward.
  - name: bench-b7-classified
    address: "0.0.0.0:8084"
    filter_chains: [bench-b7-classified-chain]

  # B-7 control arm: identical, minus the one filter under test.
  - name: bench-b7-baseline
    address: "0.0.0.0:8085"
    filter_chains: [bench-b7-baseline-chain]

filter_chains:
  - name: ai-routing
    filters:
      # Sets x-request-id, which the llm_d_sc filter reuses as the
      # ClassifyRequest request_id so a classification can be correlated with the
      # access-log line for the same request (SPEC 4.5).
      - filter: request_id

      # V-6 evidence: the classification metadata the filter records under
      # llm_d_sc.* surfaces in these access-log records.
      - filter: access_log

      # The filter under test. Selects the upstream cluster from the ranked
      # label returned by the existing llm-d-sc classifier.
      - filter: llm_d_sc
        endpoint: "llm-d-sc.llm-d-sc.svc.cluster.local:50051"
        default_cluster: general
        timeout_ms: 100
        routes:
          - {label: SIMPLE,    cluster: small}
          - {label: MEDIUM,    cluster: small}
          - {label: COMPLEX,   cluster: large}
          - {label: REASONING, cluster: large}

      # Injects the ds4 bearer token ONLY on requests routed to `large`.
      # Reads the value from the DS4_API_KEY environment variable (supplied by
      # secretKeyRef), so no credential appears in this file or in the ConfigMap.
      # Must sit AFTER llm_d_sc, which is what sets ctx.cluster.
      - filter: credential_injection
        clusters:
          - name: large
            header: "Authorization"
            header_prefix: "Bearer "
            env_var: DS4_API_KEY

      - filter: load_balancer
        clusters:
          - name: small
            endpoints: ["llama-server-qwen38.homelab-maas.svc.cluster.local:80"]
          - name: large
            endpoints: ["llama-server-ds4.homelab-maas.svc.cluster.local:8080"]
          # The fail-open target. Points at the SMALL model on purpose: if the
          # classifier is unavailable, unclassified traffic should land on the
          # cheaper, faster backend rather than the 284 B one. The opposite
          # choice is equally defensible; see deploy/README.md.
          - name: general
            endpoints: ["llama-server-qwen38.homelab-maas.svc.cluster.local:80"]

  # ---------------------------------------------------------------------------
  # BENCHMARK CHAINS (SPEC-BENCH B-5 / B-7)
  # ---------------------------------------------------------------------------

  # B-5 `always-large`. Structurally identical to `ai-routing` except that the
  # cluster-selecting filter is `router` (static) instead of `llm_d_sc`
  # (content-aware). Same request_id, same access_log, same
  # credential_injection, same load_balancer - so the arm difference is the
  # routing decision and nothing else.
  - name: bench-large-chain
    filters:
      - filter: request_id
      - filter: access_log
      - filter: router
        routes:
          - path_prefix: "/"
            cluster: large
      # ds4 requires a bearer token; without this the arm returns 401 on every
      # request and would measure error latency instead of generation latency.
      # Keyed on ctx.cluster exactly as in `ai-routing`; `router` sets it the
      # same way `llm_d_sc` does.
      - filter: credential_injection
        clusters:
          - name: large
            header: "Authorization"
            header_prefix: "Bearer "
            env_var: DS4_API_KEY
      - filter: load_balancer
        clusters:
          - name: large
            endpoints: ["llama-server-ds4.homelab-maas.svc.cluster.local:8080"]

  # B-5 `always-small`. qwen38 needs no credential, so there is no
  # credential_injection here - matching the production path, where `small` is
  # deliberately absent from the credential map.
  - name: bench-small-chain
    filters:
      - filter: request_id
      - filter: access_log
      - filter: router
        routes:
          - path_prefix: "/"
            cluster: small
      - filter: load_balancer
        clusters:
          - name: small
            endpoints: ["llama-server-qwen38.homelab-maas.svc.cluster.local:80"]

  # B-7 measured arm. Same classifier endpoint, timeout and route table as the
  # production chain, so the hop being timed is the production hop.
  - name: bench-b7-classified-chain
    filters:
      - filter: request_id
      - filter: llm_d_sc
        endpoint: "llm-d-sc.llm-d-sc.svc.cluster.local:50051"
        default_cluster: general
        timeout_ms: 100
        routes:
          - {label: SIMPLE,    cluster: small}
          - {label: MEDIUM,    cluster: small}
          - {label: COMPLEX,   cluster: large}
          - {label: REASONING, cluster: large}
      - filter: static_response
        status: 200
        headers:
          - name: content-type
            value: application/json
        body: '{"id":"b7-static","object":"chat.completion","created":0,"model":"b7-static","choices":[{"index":0,"message":{"role":"assistant","content":"b7"},"finish_reason":"stop"}],"usage":{"prompt_tokens":0,"completion_tokens":1,"total_tokens":1}}'

  # B-7 control arm. Byte-identical to the chain above with `llm_d_sc` removed.
  # The delta between the two is the Praxis -> llm-d-sc hop plus the classify
  # work, measured from inside the cluster.
  - name: bench-b7-baseline-chain
    filters:
      - filter: request_id
      - filter: static_response
        status: 200
        headers:
          - name: content-type
            value: application/json
        body: '{"id":"b7-static","object":"chat.completion","created":0,"model":"b7-static","choices":[{"index":0,"message":{"role":"assistant","content":"b7"},"finish_reason":"stop"}],"usage":{"prompt_tokens":0,"completion_tokens":1,"total_tokens":1}}'
